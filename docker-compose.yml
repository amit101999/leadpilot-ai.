# LeadPilot services.
#
#   Local development:  docker compose up -d postgres        (then `npm run dev`)
#   Full stack:         docker compose --profile stack up -d --build
#   Production:         docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile stack up -d --build
#
# Values come from .env (never committed); see .env.example and docs/deployment.md.
# Interpolation runs for every service even when its profile is off, so stack-only
# variables use ${VAR:-default} here and are validated by the services themselves.
name: leadpilot

# Variables the web app and the migrator share. Defaults mirror src/lib/configuration/env.ts:
# an empty string would fail its enum/number checks, so nothing is passed as "".
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-leadpilot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-leadpilot}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  AUTH_SECRET: ${AUTH_SECRET:-}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RUN_EXECUTOR: ${RUN_EXECUTOR:-inprocess}
  N8N_BASE_URL: http://n8n:5678
  N8N_WEBHOOK_PATH: ${N8N_WEBHOOK_PATH:-/webhook/leadpilot-run}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
  RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-300}
  AI_BATCH_SIZE: ${AI_BATCH_SIZE:-5}
  AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
  NOTIFY_BATCH_SIZE: ${NOTIFY_BATCH_SIZE:-5}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
  WHATSAPP_DEFAULT_RECIPIENT: ${WHATSAPP_DEFAULT_RECIPIENT:-}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_SUMMARY_TEMPLATE_NAME: ${WHATSAPP_SUMMARY_TEMPLATE_NAME:-}
  WHATSAPP_TEST_TEMPLATE_NAME: ${WHATSAPP_TEST_TEMPLATE_NAME:-hello_world}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
  WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
  WHATSAPP_TIMEOUT_MS: ${WHATSAPP_TIMEOUT_MS:-15000}
  JOB_SOURCE_PROVIDER: ${JOB_SOURCE_PROVIDER:-mock}
  JOB_SOURCE_API_BASE_URL: ${JOB_SOURCE_API_BASE_URL:-}
  JOB_SOURCE_API_KEY: ${JOB_SOURCE_API_KEY:-}
  UPWORK_CLIENT_ID: ${UPWORK_CLIENT_ID:-}
  UPWORK_CLIENT_SECRET: ${UPWORK_CLIENT_SECRET:-}
  UPWORK_JOB_SEARCH_SCOPE_CONFIRMED: ${UPWORK_JOB_SEARCH_SCOPE_CONFIRMED:-false}
  MOCK_SOURCE_SCENARIO: ${MOCK_SOURCE_SCENARIO:-default}

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadpilot}
    # Loopback only: the database is never reachable from other machines.
    # 55432 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies pending migrations (safe to repeat) before the web app starts.
  # Seed once with: docker compose --profile stack run --rm migrate npm run db:seed
  migrate:
    profiles: [stack]
    build:
      context: .
      target: migrator
    image: leadpilot-migrator:local
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: [stack]
    build:
      context: .
      target: runner
    image: leadpilot-web:local
    environment: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: imports the webhook credential (built from N8N_WEBHOOK_SECRET inside the
  # container) and the run workflow, then publishes it. Repeatable; runs before n8n starts.
  n8n-import:
    profiles: [stack]
    image: n8nio/n8n:2.42.7
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ -n "$${N8N_ENCRYPTION_KEY}" ] || { echo "N8N_ENCRYPTION_KEY is not set"; exit 1; }
        [ -n "$${N8N_WEBHOOK_SECRET}" ] || { echo "N8N_WEBHOOK_SECRET is not set"; exit 1; }
        umask 077
        creds="$$(mktemp)"
        trap 'rm -f "$$creds"' EXIT
        node -e 'process.stdout.write(JSON.stringify([{ id: "leadpilotWebhookAuth", name: "LeadPilot webhook secret", type: "httpHeaderAuth", data: { name: "X-LeadPilot-Webhook-Secret", value: process.env.N8N_WEBHOOK_SECRET } }]))' > "$$creds"
        n8n import:credentials --input="$$creds"
        n8n import:workflow --input=/workflows/leadpilot-run.json
        n8n publish:workflow --id=leadpilotRunFlow
    restart: "no"

  n8n:
    profiles: [stack]
    image: n8nio/n8n:2.42.7
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # The workflow reads the two LEADPILOT_* values with $env (see n8n/documentation/README.md).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      LEADPILOT_APP_URL: http://web:3000
      LEADPILOT_INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    # Editor for the operator only (SSH tunnel in production); the app uses the Docker network.
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  n8n-data:
