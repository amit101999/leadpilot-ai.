# Local Postgres for development and the automated tests (production runs on Render + Neon).
#
#   docker compose up -d postgres        (then `npm run dev`)
#
# Values come from .env (never committed); see .env.example.
name: leadpilot

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadpilot}
    # Loopback only: the database is never reachable from other machines.
    # 55432 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate test database (TEST_DATABASE_URL) on the first start.
      - ./database/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
