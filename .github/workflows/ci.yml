# CI for LeadPilot. See docs/deployment.md.
#
#   pull request and push to main -> quality, integration, e2e, build
#
# Render deploys a commit on main only after these checks pass (render.yaml: autoDeployTrigger: checksPass).
# No application secret is stored in GitHub: they live in Render's environment settings.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR/branch supersedes the running checks. Deploys have their own group below.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22.23.5" # same as the Dockerfile
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leadpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpilot -d leadpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway values for this job only. DATABASE_URL must differ from TEST_DATABASE_URL (setup.ts refuses otherwise);
      # it is replaced by TEST_DATABASE_URL before any connection is made.
      TEST_DATABASE_URL: postgres://leadpilot:ci-only-password@localhost:5432/leadpilot_test
      DATABASE_URL: postgres://unused:unused@localhost:5432/unused
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leadpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpilot -d leadpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://leadpilot:ci-only-password@localhost:5432/leadpilot_test
      DATABASE_URL: postgres://unused:unused@localhost:5432/unused
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  build:
    name: Production build, Docker images, Compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Build the Docker image (not pushed)
        # The same image Render builds on deploy, so a broken Dockerfile fails here instead of in production.
        run: docker build --tag leadpilot-web:ci .
      - name: Validate the Compose file (local Postgres)
        env:
          # Placeholder only: `config` checks syntax and required variables; nothing is started.
          POSTGRES_PASSWORD: placeholder
        run: docker compose -f docker-compose.yml config --quiet

