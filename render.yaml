# Render Blueprint for LeadPilot (free plan). Setup: docs/deployment.md, "Render + Neon (free hosting)".
#
# One web service built from the Dockerfile (final `runner` stage). The database is Neon (free, external),
# e-mail goes through Brevo's HTTPS API (Render's free plan blocks outbound SMTP ports), runs execute
# inside the app, and migrations run at startup (MIGRATE_ON_START; the free plan has no pre-deploy step).
# Render deploys a commit on main only after its GitHub checks (.github/workflows/ci.yml) have passed.
services:
  - type: web
    name: leadpilot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    domains:
      - leads.peepalx.com
    envVars:
      # Fixed settings
      - key: APP_BASE_URL
        value: https://leads.peepalx.com
      - key: MIGRATE_ON_START
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: LOG_LEVEL
        value: info
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMAIL_PROVIDER
        value: brevo
      - key: UPWORK_SYNC_SCHEDULED_ALLOWED
        value: "true" # decided 2026-11-17 after reviewing Upwork's terms; scheduled syncs (cloud routine) are allowed
      # Generated once by Render (base64, 256 bits); signs sessions and import tokens. Never change it.
      - key: AUTH_SECRET
        generateValue: true
      # Secrets: entered in the Render dashboard when the Blueprint is created (never committed).
      - key: DATABASE_URL # Neon connection string (direct, not "-pooler"), ending in ?sslmode=require
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM # a sender verified in Brevo, e.g. "LeadPilot <alerts@peepalx.com>"
        sync: false
      # Optional single admin login (username + password, no seed needed); both or neither, password 8+ characters.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
